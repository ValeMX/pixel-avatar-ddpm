# Configuration file for the pixel-avatar-ddpm project

project_name: "pixel-avatar-ddpm"
seed: 42 # For reproducibility

dataset:
  raw_dataset_10k_path: "data/raw/cartoonset10k"
  raw_dataset_100k_path: "data/raw/cartoonset100k"
  processed_dataset_path: "data/processed"
  split_dataset_path: "data/splits"
  checkpoint_path: "checkpoints"
  image_extension: "png" # File extension of the images in the dataset
  attributes_extension: "csv" # File extension of the attributes files in the dataset
  caption_extension: "txt" # File extension of the caption files in the dataset
  crop_size: 64 # Crop size for removing white borders from images
  image_size: 32 # Image size for training (32x32) or (64x64)
  strategy: "bilinear" # Resampling strategy for resizing images

  held_out_combinations:
    - {
        attribute_1: hair_color,
        value_1: red,
        attribute_2: eye_color,
        value_2: blue,
      }

model:
  # ResNet Parameters
  resnet_in_channels: 3 # Number of input channels (RGB images)
  resnet_out_channels: 3 # Number of output channels (RGB images)
  resnet_base_channels: 128 # Base number of channels in the ResNet
  resnet_spatial_resolutions: 3 # Number of spatial resolution levels in the ResNet
  resnet_attention_heads: 4 # Number of attention heads in the ResNet

  # Time Encoder Parameters
  time_encoder_mult: 4 # Hidden size for the time encoder

  # Text Encoder Parameters
  sequence_length: 70 # Maximum sequence length for text input
  text_encoder_layers: 4 # Number of layers in the text encoder
  text_hidden_size: 128 # Hidden size for the text encoder
  dropout: 0.1 # Dropout rate for the text encoder

scheduler:
  timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  beta_max: 0.999 # Maximum value of beta for the cosine noise schedule
  s: 0.008 # Value of s for the cosine noise schedule
  type: "linear" # Type of noise schedule to use ("linear" or "cosine")

training:
  seed: 42
  epochs: 50
  batch_size: 16
  learning_rate: 0.0003
  dropout: 0.1 # Dropout rate for model regularization and Classifier-Free Guidance (CFG)
  validation_interval: 1 # Interval (in epochs) for validation during training
  patience: 15 # Number of epochs to wait for improvement before early stopping
  checkpoint_dir: "checkpoints/"

inference:
  timesteps: 200 # Number of steps for the diffusion process during inference
  guidance_scale: 3.0 # Guidance scale for Classifier-Free Guidance (CFG)
  samples: 16 # Number of samples to generate during inference
